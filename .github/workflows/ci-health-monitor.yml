# PACAA-557 / PACAA-602 — CI health monitor
# Fires every 30 minutes; turns this workflow red in GitHub Actions if any
# watched workflow's last run on main ended in failure or timed_out.
# No Telegram notifications — board directive 2026-05-12 (PACAA-602):
# alerts for things the board does not handle (CI/infra) must not page board.
# CTO/CEO see the signal via the red badge on this workflow in the Actions tab
# and via CEO weekly infra sweep.
name: CI health monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check workflow health
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install curl
        # ubuntu-24.04 runner image 20260413.86.1+ no longer ships curl.
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Inspect watched workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          WATCH=("supabase-migrate.yml" "smoke-test.yml")
          ALERT_LINES=""

          for WF in "${WATCH[@]}"; do
            RESP=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/$WF/runs?per_page=1&branch=main" \
              || echo '{}')

            CONCLUSION=$(echo "$RESP" | jq -r '.workflow_runs[0].conclusion // "no_runs"')
            UPDATED=$(echo "$RESP" | jq -r '.workflow_runs[0].updated_at // ""')
            RUN_URL=$(echo "$RESP" | jq -r '.workflow_runs[0].html_url // ""')

            if [ "$CONCLUSION" = "failure" ] || [ "$CONCLUSION" = "timed_out" ]; then
              ALERT_LINES="${ALERT_LINES}\n- ${WF}: ${CONCLUSION} (${UPDATED}) ${RUN_URL}"
            fi
          done

          if [ -n "$ALERT_LINES" ]; then
            {
              echo "## Watched workflows in failure/timed_out"
              printf '%b\n' "$ALERT_LINES"
              echo
              echo "See: https://github.com/$REPO/actions"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "CI health monitor: detected failing watched workflows — failing this run for visibility."
            exit 1
          fi

          echo "All watched workflows green."
