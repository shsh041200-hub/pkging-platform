# PACAA-303 — Post-deploy smoke test
# Fires on every GitHub Deployment status update from Vercel; skips unless
# the environment is "Production" and the state is "success".
# Fails the CI check if any critical URL returns non-200.
name: smoke-test

on:
  deployment_status: {}

jobs:
  smoke:
    name: Smoke test (production)
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install curl
        # ubuntu-24.04 runner image 20260413.86.1+ no longer ships curl.
        run: sudo apt-get update && sudo apt-get install -y curl

      - name: Resolve base URL
        id: url
        run: |
          # Always test the canonical production domain.
          # Vercel deployment URLs require auth and return 401 — cannot be used.
          TARGET="https://www.packlinx.com"
          echo "base=${TARGET}" >> "$GITHUB_OUTPUT"
          echo "Smoke-testing: ${TARGET}"

      - name: Check critical pages
        env:
          BASE: ${{ steps.url.outputs.base }}
        run: |
          # Paths verified against app/ route tree as of PACAA-303.
          # Korean slugs are percent-encoded so curl does not need locale flags.
          PATHS=(
            "/"
            "/categories/food-beverage"
            "/guides/flexible-packaging-guide"
            "/guides/packaging-accessories-guide"
            "/guides/packaging-machinery-guide"
            "/guides/plastic-container-guide"
            "/keywords/%EA%B3%A8%ED%8C%90%EC%A7%80%EB%B0%95%EC%8A%A4-%EC%A0%9C%EC%9E%91"
            "/sitemap.xml"
          )

          FAIL=0
          for PATH in "${PATHS[@]}"; do
            URL="${BASE}${PATH}"
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 --location "$URL")
            if [ "$HTTP" -eq 200 ]; then
              echo "✅ $HTTP  $PATH"
            else
              echo "❌ $HTTP  $PATH"
              FAIL=1
            fi
          done

          if [ "$FAIL" -eq 1 ]; then
            echo ""
            echo "One or more URLs returned non-200. Manual action required:"
            echo "  Vercel dashboard → Deployments → Instant Rollback to previous."
            exit 1
          fi
          echo ""
          echo "All ${#PATHS[@]} checks passed."
