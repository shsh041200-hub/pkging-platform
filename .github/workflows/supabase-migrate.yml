name: Supabase Migrate

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check for duplicate migration version prefixes
        run: |
          all_versions=$(ls supabase/migrations/*.sql 2>/dev/null \
            | xargs -I{} basename {} \
            | grep -oE '^[0-9]+' \
            | sort)
          dupes=$(echo "$all_versions" | uniq -d)
          if [ -n "$dupes" ]; then
            echo "ERROR: Duplicate migration version prefix(es) detected: $dupes"
            echo "Use a full 14-digit timestamp (YYYYMMDDHHmmSS) to make each version unique."
            exit 1
          fi
          echo "OK: no duplicate version prefixes"

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        run: supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M:%S UTC')
          SHORT_SHA="${GITHUB_SHA::7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="🚨 <b>Supabase Migrate 실패</b>

워크플로우: <code>${{ github.workflow }}</code>
커밋: <code>${SHORT_SHA}</code> (<a href=\"https://github.com/${{ github.repository }}/commit/${{ github.sha }}\">${{ github.ref_name }}</a>)
시각: ${TIMESTAMP}
실행 로그: ${RUN_URL}"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
