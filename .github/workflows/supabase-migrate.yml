# PACAA-299 — Supabase migration CI
# Runs on push to main when migration files change.
# Applies all pending migrations via `supabase db push` (tracked in supabase_migrations table).
#
# Required GitHub Secrets:
#   SUPABASE_PROJECT_REF    — project ref (e.g. "abcdefghijklmnop"), from project Settings
#   SUPABASE_ACCESS_TOKEN   — personal access token from app.supabase.com/account/tokens
#   SUPABASE_DB_PASSWORD    — database password from project Settings → Database
name: Supabase Migrate

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations
        run: supabase db push --password ${{ secrets.SUPABASE_DB_PASSWORD }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
